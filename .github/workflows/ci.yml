name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8 kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Garajim.sln

      - name: Build (Release)
        run: dotnet build Garajim.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Garajim.sln --configuration Release --no-build --verbosity normal

      - name: Docker imajı build (push edilmez)
        run: docker build -t garajim-api:ci .

      - name: Docker imajını çalıştır ve kök adresi doğrula
        run: |
          docker run -d --name garajim-smoke -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e "ConnectionStrings__Default=Server=ci-dummy,1433;Database=GarajimDb;User Id=ci;Password=ci-parola;TrustServerCertificate=True" \
            -e "Jwt__Key=ci-ortami-icin-en-az-32-baytlik-sahte-imzalama-anahtari" \
            -e "Smtp__Host=ci-dummy-smtp" \
            -e "Smtp__User=ci" \
            -e "Smtp__Pass=ci-parola" \
            -e "Smtp__From=ci@garajim.local" \
            -e UseBackgroundJobs=false \
            garajim-api:ci

          for deneme in $(seq 1 20); do
            kod=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$kod" = "200" ]; then
              swagger=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/swagger/index.html || true)
              echo "Kök adres 200 döndü ($deneme. deneme), Swagger: $swagger"
              docker rm -f garajim-smoke > /dev/null
              exit 0
            fi
            sleep 3
          done

          echo "::error::Konteyner 60 saniye içinde kök adrese 200 dönmedi. İmaj build oluyor ama çalışmıyor."
          docker logs garajim-smoke || true
          docker rm -f garajim-smoke > /dev/null || true
          exit 1

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8 kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Garajim.sln

      - name: Zafiyetli paket taraması
        run: |
          dotnet list Garajim.sln package --vulnerable --include-transitive > vulnerable.txt 2>&1
          cat vulnerable.txt
          if grep -qE "has the following vulnerable packages|güvenlik açığı olan paketlere sahip" vulnerable.txt; then
            echo "::error::Zafiyetli NuGet paketi bulundu."
            exit 1
          fi
          echo "Zafiyetli paket yok."
