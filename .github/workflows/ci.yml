name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8 kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Garajim.sln

      - name: Build (Release)
        run: dotnet build Garajim.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Garajim.sln --configuration Release --no-build --verbosity normal
